name: My-GitHubActions-Basics
env:
  APPLICATION_NAME       : "MyFlask"
  DEPLOY_PACKAGE_NAME    : "flask-deply-over-${{ github.sha }}"


on:
  push:
    branches:
      - main


jobs:
  my_testing:
    runs-on: ubuntu-latest

    steps:
    - name: Print Hello Message in Testing
      run: echo "Hello World from Testing"

    - name: Execute few commands
      run : |
        echo "Hello Message1"
        echo "Hello Message2"
        echo "Application name: ${{env.APPLICATION_NAME }}"
    - name: List current folder
      run : ls -la
    - name: Git clone my repo
      uses: actions/checkout@v1


  my_deploy:
    runs-on: ubuntu-latest
    needs: my_testing
    
    steps:
    - name: Print Hello Message in Deploy
      run: echo "Hello World from Deploy job"

    - name: Printing Deployment package
      run : echo "Deploy pakcage name is ${{ env.DEPLOY_PACKAGE_NAME }}"

    - name: Lets test some packages iof the are here 1
      run : aws --version
    - name: Lets test some packages iof the are here 2
      run : zip











